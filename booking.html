<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Booking | Photography by Norma & Eduardo</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet"></head><body>
<header class="site-header"><a href="index.html" class="brand">Photography by Norma & Eduardo</a><nav class="main-nav"><a href="index.html">Home</a><a href="packages.html">Packages</a><a href="gallery.html">Gallery</a><a href="about.html">About</a><a class="active" href="booking.html">Book a Session</a><a href="contact.html">Contact</a><a href="admin.html">Admin</a></nav></header>
<main class="section"><p class="kicker">Booking Request</p><h1 class="section-title">Book a Session</h1><div class="form-wrap"><form id="bookingForm" action="mailto:hello@reallygreatsite.com" method="post" enctype="text/plain"><div class="form-grid"><div><label for="name">Full Name</label><input id="name" name="name" required></div><div><label for="phone">Phone</label><input id="phone" name="phone" required></div><div><label for="email">Email</label><input id="email" type="email" name="email" required></div><div><label for="packageSelect">Package</label><select id="packageSelect" name="package"><option value="50">Mini Session</option><option value="100">Standard Session</option><option value="150">Premium Session</option><option value="300">Deluxe Session</option></select></div><div><label for="dateInput">Preferred Date</label><input id="dateInput" type="date" name="date"></div><div><label for="timeInput">Preferred Time</label><input id="timeInput" type="time" name="time"></div><div><label for="sessionType">Studio / Outdoor</label><select id="sessionType" name="location_type"><option>Studio</option><option>Location</option></select></div><div><label for="paymentOption">Payment</label><select id="paymentOption" name="payment_option"><option value="deposit">Deposit (50%)</option><option value="full">Pay in Full</option></select></div></div><div id="addressField" class="hidden" style="margin-top:1rem;"><label for="locationAddress">Location Address</label><input id="locationAddress" name="location_address" placeholder="Street address for location sessions"></div><div style="margin-top:1rem;"><label for="notes">Notes</label><textarea id="notes" name="notes" placeholder="Tell us your vision, number of people, and timing."></textarea></div><div style="margin-top:1rem;"><p><strong>Total:</strong> <span id="totalAmount">$0.00</span></p><p><strong>Deposit:</strong> <span id="depositAmount">$0.00</span></p><p><strong>Balance Due:</strong> <span id="balanceDue">$0.00</span></p><p id="formMessage"></p></div><div style="margin-top:1rem;"><button type="submit">Send Booking Request</button></div></form></div></main><script src="script.js"></script></body></html>
