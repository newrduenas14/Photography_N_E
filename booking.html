<main class="section"><p class="kicker">Booking Request</p><h1 class="section-title">Book a Session</h1><div class="form-wrap"><form action="mailto:hello@reallygreatsite.com" method="post" enctype="text/plain"><div class="form-grid"><div><label for="name">Full Name</label><input id="name" name="name" required></div><div><label for="phone">Phone</label><input id="phone" name="phone" required></div><div><label for="email">Email</label><input id="email" type="email" name="email" required></div><div><label for="package">Package</label><select id="package" name="package"><option>Portrait Signature</option><option>Family Story</option><option>Graduation Editorial</option><option>Custom Session</option></select></div><div><label for="date">Preferred Date</label><input id="date" type="date" name="date"></div><div><label for="locationType">Studio / Outdoor</label><select id="locationType" name="location_type"><option>Studio</option><option>Outdoor</option></select></div></div><div style="margin-top:1rem;"><label for="notes">Notes</label><textarea id="notes" name="notes" placeholder="Tell us your vision, number of people, and timing."></textarea></div><div style="margin-top:1rem;"><button type="submit">Send Booking Request</button></div></form></div></main></body></html>
